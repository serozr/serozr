name: Update Stars Count

on:
  schedule:
    - cron: '0 0 * * *' # Günde bir kez çalışır (UTC 00:00)
  workflow_dispatch:

jobs:
  update-stars:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with current stars
        run: |
          REPO="serozr/cyber-portfolio"

          RESPONSE=$(curl -s -f \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/$REPO")

          STARS=$(echo "$RESPONSE" | jq -r '.stargazers_count // empty')

          if ! [[ "$STARS" =~ ^[0-9]+$ ]]; then
            echo "Invalid stars count: $STARS"
            echo "$RESPONSE"
            exit 1
          fi

          sed -i -E "s/⭐ [0-9]+|⭐ null/⭐ $STARS/g" README.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "🤖 chore: update stars count [skip ci]"
            git push
          fi
